name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier que manifest.json correspond au tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('custom_components/nrjmobile/manifest.json'))['version'])")
          echo "tag=$TAG  manifest=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Le tag v$TAG ne correspond pas à manifest.json ($VER). Bump d'abord la version dans manifest.json."
            exit 1
          fi

      - name: Construire l'asset nrjmobile.zip
        # zip_release : le zip contient les fichiers de l'intégration à sa racine
        # (manifest.json, *.py, translations/, brand/), extraits dans
        # custom_components/nrjmobile/. GitHub compte les téléchargements de cet asset.
        run: |
          cd custom_components/nrjmobile
          zip -r "$GITHUB_WORKSPACE/nrjmobile.zip" . -x '*.pyc' -x '*__pycache__*'

      - name: Créer la Release GitHub (+ asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes nrjmobile.zip
